<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico Rápido orienta.vc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: uma coluna de até 560px, telas curtas com barra de progresso fixa no topo e botões fixos embaixo (polegar). */
:root {
  --verde: #2ECC71;
  --verde-esc: #27AE60;
  --esmeralda: #13A36A;
  --laranja: #F39C12;
  --vermelho: #E5604E;
  --cinza: #B8C2CF;
  --fundo: #F7F9FC;
  --card: #FFFFFF;
  --texto: #1A2332;
  --apoio: #5B6B7F;
  --linha: #E6EBF2;
  --campo: #F0F4F9;
  --font: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fundo); color: var(--texto); font-family: var(--font);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; color: inherit; }
.dx-wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 8px; }

/* topo */
.dx-top { position: sticky; top: 0; z-index: 5; background: var(--fundo); padding: 12px 16px 10px; }
.dx-top-in { max-width: 528px; margin: 0 auto; }
.dx-top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dx-top-row { align-items: center !important; }
.dx-logo-link { display: block; line-height: 0; }
.dx-logo { height: 30px; width: auto; display: block; }
.dx-etapa { font-size: 13px; font-weight: 500; color: var(--apoio); }
.dx-bar { height: 6px; background: var(--linha); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.dx-bar i { display: block; height: 100%; background: var(--verde); border-radius: 99px; transition: width .3s; }

h1 { font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; margin: 16px 0 6px; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 28px 0 10px; text-wrap: balance; }
.dx-intro { color: var(--apoio); margin: 0 0 16px; }

.dx-card { background: var(--card); border-radius: 16px; box-shadow: 0 2px 14px rgba(26,35,50,.06); padding: 18px 16px; margin-bottom: 14px; display: grid; gap: 18px; }
.dx-ct { font-weight: 700; font-size: 17px; margin: 0; }
.dx-hint { font-size: 13.5px; color: var(--apoio); margin: -10px 0 0; }
.dx-card > .dx-hint:first-child, .dx-ct + .dx-hint { margin-top: -12px; }

/* campos */
.dx-f { display: grid; gap: 6px; }
.dx-l { font-weight: 500; font-size: 15px; }
.dx-h { font-size: 13px; color: var(--apoio); }
.dx-in { display: flex; align-items: center; background: var(--campo); border-radius: 12px; padding: 0 14px; min-height: 56px; }
.dx-in span { font-weight: 600; color: var(--apoio); font-size: 18px; margin-right: 6px; }
.dx-in em { font-style: normal; color: var(--apoio); font-size: 14px; margin-left: 6px; white-space: nowrap; }
.dx-in input, .dx-in select { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 22px; font-weight: 700; padding: 12px 0; font-variant-numeric: tabular-nums; }
.dx-in select { font-size: 17px; font-weight: 600; appearance: none; -webkit-appearance: none; }
.dx-in.sel::after { content: "▾"; color: var(--apoio); }
.dx-in.txt input { font-size: 18px; font-weight: 600; }
.dx-in:focus-within { box-shadow: 0 0 0 2px var(--verde); }
.dx-in input::placeholder { color: #A9B4C2; font-weight: 500; }
.dx-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dx-f { min-width: 0; }
.dx-in input { width: 100%; }
.dx-grid2 .dx-in { padding: 0 10px; }
.dx-grid2 .dx-in span { font-size: 15px; margin-right: 4px; }
.dx-grid2 .dx-in input { font-size: 19px; }

.dx-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.dx-chip { min-height: 44px; padding: 10px 16px; border-radius: 99px; border: 1.5px solid var(--linha); background: var(--card); font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; }
.dx-chip[aria-pressed="true"] { background: var(--verde-esc); border-color: var(--verde-esc); color: #fff; font-weight: 600; }
.dx-chip:focus-visible, .dx-btn:focus-visible, .dx-link:focus-visible { outline: 3px solid var(--laranja); outline-offset: 2px; }

.dx-checks { display: grid; gap: 10px; }
.dx-check { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--linha); background: var(--card); text-align: left; cursor: pointer; }
.dx-check b { display: block; font-size: 16px; font-weight: 700; }
.dx-check small { display: block; font-size: 13.5px; color: var(--apoio); margin-top: 2px; }
.dx-box { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #A9B4C2; flex: none; display: grid; place-items: center; background: var(--card); }
.dx-box svg { opacity: 0; }
.dx-check[aria-checked="true"] { border-color: var(--verde-esc); background: #F1FBF5; }
.dx-check[aria-checked="true"] .dx-box { background: var(--verde-esc); border-color: var(--verde-esc); }
.dx-check[aria-checked="true"] .dx-box svg { opacity: 1; }
.dx-check:focus-visible { outline: 3px solid var(--laranja); outline-offset: 2px; }
.dx-item { border: 1.5px solid var(--linha); border-radius: 14px; padding: 14px; display: grid; gap: 16px; }
.dx-item-h { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.dx-del { border: 0; background: none; color: var(--vermelho); font-weight: 600; font-size: 14px; padding: 8px; cursor: pointer; }
.dx-add { border: 1.5px dashed var(--verde-esc); background: transparent; color: var(--verde-esc); border-radius: 14px; min-height: 52px; font-weight: 700; font-size: 15px; cursor: pointer; }

.dx-live { background: #E9F9F0; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 15px; }
.dx-live b { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* rodapé */
.dx-nav { padding: 8px 16px calc(32px + env(safe-area-inset-bottom)); }
.dx-nav-in { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; }
.dx-btn { min-height: 54px; border-radius: 14px; border: 0; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0 20px; }
.dx-btn.pri { background: var(--verde-esc); color: #fff; flex: 1; }
.dx-btn.pri:active { background: #1F9452; }
.dx-btn.sec { background: var(--card); color: var(--texto); box-shadow: inset 0 0 0 1.5px var(--linha); }
.dx-btn.full { width: 100%; }
.dx-btn:disabled { opacity: .5; cursor: default; }
.dx-link { background: none; border: 0; color: var(--verde-esc); font-weight: 700; font-size: 15px; cursor: pointer; padding: 6px 0; }

/* início */
.dx-welcome { background: linear-gradient(150deg, var(--verde) 0%, var(--verde-esc) 70%, var(--esmeralda) 100%); color: #fff; border-radius: 20px; padding: 26px 20px; margin: 12px 0 14px; }
.dx-welcome h1 { margin: 0 0 10px; font-size: 30px; }
.dx-welcome p { margin: 0; font-size: 16px; opacity: .95; }
.dx-welcome .dx-tempo { display: inline-block; margin-top: 16px; background: rgba(255,255,255,.2); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 14px; }
.dx-welcome.dx-branco { background: var(--card); color: var(--texto); box-shadow: 0 2px 14px rgba(26,35,50,.06); }
.dx-welcome.dx-branco p { color: var(--apoio); opacity: 1; }
.dx-welcome.dx-branco .dx-tempo { background: #E9F9F0; color: #1E8C4E; }
body .dx-live.dx-verde, body.dx-laranja .dx-live.dx-verde { background: #E9F9F0; margin-bottom: 10px; }
.dx-borrado { filter: blur(6px); user-select: none; pointer-events: none; }
.dx-regra { padding: 10px 0 12px; border-top: 1px solid var(--linha); }
.dx-regra:first-of-type { border-top: 0; }
.dx-regra-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.dx-regra-h b { display: block; font-size: 16px; }
.dx-regra-h small { display: block; font-size: 13px; color: var(--apoio); }
.dx-regra-v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dx-regra-b { position: relative; height: 12px; background: var(--campo); border-radius: 0 6px 6px 0; margin-top: 8px; }
.dx-regra-b i { display: block; height: 100%; border-radius: 0 6px 6px 0; }
.dx-regra-b u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--texto); border-radius: 2px; }
.dx-regra-s { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--apoio); margin-top: 6px; font-weight: 500; }
.dx-apo { background: linear-gradient(150deg, var(--verde) 0%, var(--verde-esc) 100%); color: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.dx-apo span { display: block; font-size: 13px; opacity: .9; font-weight: 500; }
.dx-apo b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dx-apo em { font-style: normal; font-size: 13px; opacity: .9; }
.dx-br-b.dx-meta { position: relative; overflow: visible; }
.dx-br-b.dx-meta u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--texto); border-radius: 2px; }
.dx-meta-t { font-size: 11.5px; color: var(--apoio); margin-top: 4px; white-space: nowrap; transform: translateX(-1px); }
.dx-erro { color: #B53B2A; font-size: 14px; font-weight: 600; margin: -6px 0 0; }
.dx-pop { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.dx-pop-fundo { position: absolute; inset: 0; background: rgba(26,35,50,.45); }
.dx-pop-card { position: relative; background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(26,35,50,.18); animation: dxSobe .25s ease-out; }
@media (min-width: 600px) { .dx-pop { align-items: center; } .dx-pop-card { border-radius: 20px; } }
@keyframes dxSobe { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dx-pop-card { animation: none; } }
.dx-pop-card h3 { font-size: 21px; font-weight: 800; line-height: 1.25; margin: 0 28px 14px 0; text-wrap: balance; }
.dx-pop-card h3 b { color: var(--verde-esc); }
.dx-pop-card ol { margin: 0 0 18px; padding-left: 22px; display: grid; gap: 10px; font-size: 15.5px; }
.dx-pop-card li::marker { font-weight: 800; color: var(--laranja); }
.dx-pop-x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--campo); font-size: 24px; line-height: 1; cursor: pointer; color: var(--texto); }
.dx-pop-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; }
.dx-fim-ol { margin: 4px 0 16px; padding-left: 22px; display: grid; gap: 8px; opacity: .95; }
.dx-fim-ol li::marker { font-weight: 800; color: var(--laranja); }
.dx-fim-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; background: var(--verde); color: var(--texto); }
.dx-pop-card li b, .dx-fim-ol li b { font-weight: 700; }
.dx-alerta { background: #FDE8E5; border-radius: 14px; padding: 14px 16px; font-size: 15px; margin: 4px 0 10px; color: var(--texto); }
.dx-alerta b { display: block; color: #B53B2A; font-size: 16px; margin-bottom: 4px; }
.dx-alerta.dx-alerta-y { background: #FEF1DC; }
.dx-alerta.dx-alerta-y b { color: #B86E00; }
.dx-segs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.dx-seg { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: 0 2px 14px rgba(26,35,50,.06); }
.dx-seg b { display: block; font-size: 15px; }
.dx-seg span { font-size: 13px; color: var(--apoio); }
.dx-seg i { display: block; width: 26px; height: 4px; border-radius: 4px; background: var(--verde); margin-bottom: 10px; }
.dx-privado { font-size: 13.5px; color: var(--apoio); margin: 14px 0 0; }
.dx-stack { display: grid; gap: 10px; }

/* revisão */
.dx-rev { display: grid; gap: 0; }
.dx-rev-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--linha); }
.dx-rev-row:last-child { border-bottom: 0; }
.dx-rev-row span { color: var(--apoio); font-size: 14px; }
.dx-rev-row b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.dx-aviso { background: #FFF6E6; border-radius: 14px; padding: 14px 16px; font-size: 14.5px; margin-bottom: 14px; }
.dx-aviso b { display: block; margin-bottom: 4px; }
.dx-aviso ul { margin: 6px 0 0; padding-left: 18px; }

/* relatório */
.dx-hero { background: linear-gradient(150deg, var(--verde) 0%, var(--verde-esc) 65%, var(--esmeralda) 100%); color: #fff; border-radius: 20px; padding: 22px 20px 24px; margin-top: 12px; }
.dx-hero small { font-size: 14px; font-weight: 500; opacity: .9; }
.dx-hero h1 { margin: 4px 0 14px; font-size: 24px; }
.dx-nota { display: flex; align-items: baseline; gap: 6px; }
.dx-nota b { font-size: 76px; line-height: .9; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.dx-nota span { font-size: 20px; font-weight: 600; opacity: .85; }
.dx-faixa { display: inline-block; margin-top: 14px; background: #fff; color: var(--verde-esc); font-weight: 800; border-radius: 99px; padding: 6px 14px; font-size: 15px; }
.dx-hero p { margin: 10px 0 0; font-size: 16px; }
.dx-exemplo { background: #FFF6E6; border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.dx-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dx-kpi { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: 0 2px 14px rgba(26,35,50,.06); }
.dx-kpi.wide { grid-column: 1 / -1; }
.dx-kpi span { display: block; font-size: 13px; color: var(--apoio); font-weight: 500; }
.dx-kpi b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.dx-kpi.wide b { font-size: 30px; }
.dx-kpi em { display: block; font-style: normal; font-size: 12.5px; color: var(--apoio); margin-top: 2px; }
.dx-kpi.neg b { color: var(--vermelho); }

.dx-segcard { background: var(--card); border-radius: 16px; box-shadow: 0 2px 14px rgba(26,35,50,.06); padding: 18px 16px; margin-bottom: 14px; }
.dx-sc-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dx-sc-h h3 { margin: 0; font-size: 19px; font-weight: 800; }
.dx-sc-n { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dx-sc-n small { font-size: 14px; color: var(--apoio); font-weight: 600; }
.dx-sc-bar { height: 8px; border-radius: 99px; background: var(--linha); margin: 10px 0 14px; overflow: hidden; }
.dx-sc-bar i { display: block; height: 100%; border-radius: 99px; }
.dx-sem { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.dx-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--campo); border-radius: 99px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; }
.dx-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dx-blk { margin-top: 12px; }
.dx-blk-t { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--apoio); margin-bottom: 6px; }
.dx-msg { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 15px; }
.dx-msg .dx-dot { margin-top: 7px; }
.dx-falta { font-size: 13px; color: var(--apoio); margin-top: 10px; }
.dx-info { font-size: 14px; background: var(--campo); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }

.dx-chart { background: var(--card); border-radius: 16px; box-shadow: 0 2px 14px rgba(26,35,50,.06); padding: 16px; margin-bottom: 14px; }
.dx-chart-t { font-weight: 700; font-size: 16px; margin: 0 0 4px; }
.dx-chart-s { font-size: 13.5px; color: var(--apoio); margin: 0 0 12px; }
.dx-chart svg { width: 100%; height: auto; display: block; }
.dx-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--apoio); margin-top: 8px; }
.dx-leg span { display: inline-flex; align-items: center; gap: 6px; }
.dx-leg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.dx-leg i.ln { height: 0; border-top: 2px dashed var(--texto); border-radius: 0; width: 14px; }
.dx-br { padding: 7px 0; }
.dx-br-t { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.dx-br-t b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.dx-br-t small { color: var(--apoio); font-weight: 500; }
.dx-br-b { height: 10px; background: var(--campo); border-radius: 0 6px 6px 0; margin-top: 5px; }
.dx-br-b i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.dx-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.dx-tabs .dx-chip { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }

.dx-obj { border-top: 1px solid var(--linha); padding: 12px 0; display: grid; gap: 4px; }
.dx-obj:first-of-type { border-top: 0; padding-top: 0; }
.dx-obj-h { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
.dx-tag { font-size: 12.5px; font-weight: 700; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.dx-obj p { margin: 0; font-size: 14px; color: var(--apoio); }

.dx-passo { display: grid; grid-template-columns: 44px 1fr; gap: 12px; background: var(--card); border-radius: 16px; box-shadow: 0 2px 14px rgba(26,35,50,.06); padding: 16px; margin-bottom: 12px; border-left: 4px solid var(--laranja); }
.dx-passo-n { width: 44px; height: 44px; border-radius: 12px; background: #FEF1DC; color: #B86E00; font-weight: 800; font-size: 22px; display: grid; place-items: center; }
.dx-passo h4 { margin: 0 0 4px; font-size: 17px; font-weight: 700; }
.dx-passo p { margin: 0; font-size: 15px; color: var(--texto); }

.dx-fim { background: var(--texto); color: #fff; border-radius: 20px; padding: 22px 20px; margin-top: 22px; }
.dx-fim h3 { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
.dx-fim p { margin: 0; opacity: .9; }
.dx-legal { font-size: 12.5px; color: var(--apoio); margin: 16px 0 8px; }
.dx-toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--texto); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 9; }

/* telas de gastos e dívidas em laranja */
body.dx-laranja .dx-bar i { background: var(--laranja); }
body.dx-laranja .dx-chip[aria-pressed="true"] { background: var(--laranja); border-color: var(--laranja); }
body.dx-laranja .dx-in:focus-within { box-shadow: 0 0 0 2px var(--laranja); }
body.dx-laranja .dx-live { background: #FEF1DC; }
body.dx-laranja .dx-add { border-color: var(--laranja); color: #B86E00; }
body.dx-laranja .dx-btn.pri { background: var(--laranja); }
body.dx-laranja .dx-btn.pri:active { background: #D9860B; }
/* enquanto digita no celular, o rodapé some para não cobrir os campos */
html { scroll-padding-bottom: 24px; }
@media (min-width: 480px) { .dx-kpis { grid-template-columns: 1fr 1fr 1fr; } .dx-kpi.wide { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .dx-top, .dx-nav, .dx-exemplo, .dx-acoes, .dx-tabs { display: none !important; }
  body { background: #fff; }
  .dx-segcard, .dx-chart, .dx-passo { break-inside: avoid; box-shadow: none; border: 1px solid var(--linha); }
}
</style>
</head>
<body>
<header class="dx-top" id="topo">
  <div class="dx-top-in">
    <div class="dx-top-row"><a class="dx-logo-link" href="/#/" target="_top" aria-label="Voltar para o site orienta.vc"><img class="dx-logo" src="/logo-orienta.png" alt="orienta.vc"></a><div class="dx-etapa" id="etapa"></div></div>
    <div class="dx-bar"><i id="barra" style="width:0%"></i></div>
  </div>
</header>
<main class="dx-wrap" id="tela"></main>
<nav class="dx-nav" id="nav">
  <div class="dx-nav-in">
    <button class="dx-btn sec" id="voltar" type="button">Voltar</button>
    <button class="dx-btn pri" id="seguir" type="button">Continuar</button>
  </div>
</nav>

};

/* ====================== ESTADO ====================== */
function novo() {
  return {

}
let D = novo();

function salvar() { try { localStorage.setItem(KEY, JSON.stringify({ D, step })); } catch (e) {} }
function limpar() { try { localStorage.removeItem(KEY); } catch (e) {} }

function get(path) { return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), D); }
function setPath(path, v) {
  const ks = path.split(".");
  let o = D;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks.at(-1)] = v;
  salvar();
}

/* ====================== FORMATOS ====================== */
const has = v => typeof v === "number" && !isNaN(v);
const n0 = v => (has(v) ? v : 0);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmt(v) { if (!has(v)) return "—"; const s = Math.round(Math.abs(v)).toLocaleString("pt-BR"); return (v < 0 ? "− " : "") + "R$ " + s; }
function pct(x) { return has(x) ? Math.round(x * 100) + "%" : "—"; }
const arred50 = x => Math.ceil(x / 50) * 50;
const plural = (q, um, varios) => (q === 1 ? um : varios);

/* ====================== CÁLCULO ====================== */
function calcular(D) {
  const trab = D.perfil.trabalho || [];
  const autonomo = !(trab.length === 1 && trab[0] === "clt");
  const pior4 = D.renda.irregular === "sim" && has(D.renda.pior4) ? D.renda.pior4 : null;
  const usaPior4 = pior4 != null;
  const media = usaPior4 ? pior4 : has(D.renda.media) ? D.renda.media : null;
  const G = D.gastos;
  const essenciais = n0(G.essenciais), livres = n0(G.livres), outros = n0(G.outros);
  const guardar = has(G.guardar) ? G.guardar : null;
  const gastos = essenciais + livres + outros;
  const sobra = media != null && gastos > 0 ? media - gastos : null;
  const reservaMeta = gastos > 0 ? CONFIG.mesesReserva * gastos : null;
  const categorias = [
    { label: "Essenciais", valor: essenciais, cor: "var(--verde-esc)" },
    { label: "Livres", valor: livres, cor: "#8FA3B8" },
    { label: "Outros", valor: outros, cor: "#B8C2CF" },
    { label: "Investimentos e reserva", valor: n0(guardar), cor: "var(--verde)" }
  ].filter(c => c.valor > 0);
  return { autonomo, media, pior4, usaPior4, essenciais, livres, outros, guardar, gastos, sobra, reservaMeta, categorias };
}

function aposentadoriaConta(D, C) {
  const A = D.aposentadoria, cfg = CONFIG.aposentadoria;
  const meio = { "10": 18, "20": 25, "30": 35, "40": 45 };
  const faixa = D.perfil.idade;
  if (!has(A.renda) || A.renda <= 0 || !faixa) return null;
  const anos = meio[faixa] != null ? cfg.idadeAlvo - meio[faixa] : cfg.anosSeAcima50;
  const idadeAposentar = meio[faixa] != null ? cfg.idadeAlvo : null;
  const capital = (A.renda * 12) / cfg.retirada;
  const r = Math.pow(1 + cfg.rendimentoReal, 1 / 12) - 1, m = anos * 12;
  const jaTem = (A.fonte || []).includes("investimentos") ? n0(A.guardado) : 0;
  const futuroJaTem = jaTem * Math.pow(1 + r, m);
  const falta = Math.max(0, capital - futuroJaTem);
  const aporte = falta > 0 ? falta * r / (Math.pow(1 + r, m) - 1) : 0;
  return { anos, idadeAposentar, capital, jaTem, aporte };
}

function indicadores(D, C) {
  const L = [], add = o => L.push(o);
  const R = CONFIG.regra, base = C.media > 0 ? C.media : null;
  const pE = base ? C.essenciais / base : null, pL = base ? (C.livres + C.outros) / base : null, pI = base && has(C.guardar) ? C.guardar / base : null;
  add({ cat: 2, grupo: "regra", nome: "Essenciais", pct: pE, meta: R.essenciais, cor: pE == null ? "n" : pE <= R.essenciais ? "g" : pE <= 0.6 ? "y" : "r",
    msg: pE == null ? "Faltou informar a renda ou os essenciais." : pE <= R.essenciais ? `Seus essenciais levam ${pct(pE)} da renda, dentro dos 50%.` : `Seus essenciais levam ${pct(pE)} da renda. O ideal é até 50%.`,
    passo: { t: "Diminua os essenciais", d: "" } });
  add({ cat: 3, grupo: "regra", nome: "Lazer e outros", pct: pL, meta: R.livres, cor: pL == null ? "n" : pL <= R.livres ? "g" : pL <= 0.4 ? "y" : "r",
    msg: pL == null ? "Faltou informar a renda." : pL <= R.livres ? `Lazer e outros gastos levam ${pct(pL)} da renda, dentro dos 30%.` : `Lazer e outros gastos levam ${pct(pL)} da renda. O ideal é até 30%.`,
    passo: { t: "Ajuste o lazer", d: "" } });
  add({ cat: 1, grupo: "regra", nome: "Investimentos", pct: pI, meta: R.investimentos, cor: pI == null ? "n" : pI >= R.investimentos ? "g" : pI >= 0.1 ? "y" : "r",
    msg: pI == null ? "Faltou dizer quanto você guarda por mês." : pI >= R.investimentos ? `Você investe ${pct(pI)} da renda. Quanto mais, melhor.` : `Você investe ${pct(pI)} da renda. O mínimo é 20%, e quanto mais, melhor.`,
    passo: { t: "Invista mais", d: "" } });
  {
    const c = D.gastos.contas, n = c === "tres" ? 3 : c === "duas" ? 2 : c === "uma" ? 1 : null;
    add({ cat: 4, grupo: "envelopes", nome: "Envelopes", usados: n, cor: n == null ? "n" : n === 3 ? "g" : n === 2 ? "y" : "r",

      passo: { t: "Separe em envelopes", d: "" } });
  }

    const P = aposentadoriaConta(D, C);
    const g = n0(C.guardar);
    const cor = !P ? "n" : P.aporte === 0 || g >= P.aporte ? "g" : g >= P.aporte * 0.5 ? "y" : "r";
    add({ cat: 5, grupo: "apos", nome: "Aposentadoria", conta: P, cor,
      msg: !P ? "Faltou informar sua idade ou quanto quer receber na aposentadoria." : "",
      passo: { t: "Planeje a aposentadoria", d: "" } });
  }
  return L;
}
const PTS = { g: 100, y: 50, r: 0 };
function pontuar(L) {
  const v = L.filter(i => PTS[i.cor] != null).map(i => PTS[i.cor]);
  const geral = v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
  return { geral, faixa: geral == null ? null : CONFIG.faixas.find(f => geral <= f.ate) };
}
function escolherPassos(L) {
  const out = L.filter(i => i.cor === "r" || i.cor === "y").sort((a, b) => (a.cor === "r" ? 0 : 1) - (b.cor === "r" ? 0 : 1) || a.cat - b.cat).map(i => i.passo);
  if (out.length < 3) L.filter(i => i.cor === "n").forEach(i => out.push(i.passo));
  if (out.length < 3) out.push({ t: "Mantenha o sistema funcionando", d: "Refaça este diagnóstico a cada 6 meses ou quando a vida mudar." });
  return out.slice(0, 3);
}

const simnao = (p, label) => chips(p, label, [["sim", "Sim"], ["nao", "Não"]]);

/* ====================== TELAS ====================== */

const STATUS = { g: "Dentro da meta", y: "Perto da meta", r: "Fora da meta", n: "Faltou informar" };
function blocoRegra(L, C) {

function blocoEnvelopes(L) {

function blocoAposentadoria(L, C, D) {

  if (!P) return `<div class="dx-segcard"><div class="dx-sc-h"><h3>Aposentadoria</h3></div><div class="dx-msg"><span class="dx-dot" style="background:var(--cinza)"></span><span>${i.msg}</span></div></div>`;
  const quando = P.idadeAposentar ? `aos ${P.idadeAposentar} anos` : `daqui a ${P.anos} anos`;
  const g = n0(C.guardar);
  const comp = P.aporte === 0 ? "O que você já tem guardado deve bastar, se continuar rendendo."
    : g >= P.aporte ? `Hoje você guarda ${fmt(g)} por mês. Se tudo isso for para a aposentadoria, você chega lá.`
    : `Hoje você guarda ${fmt(g)} por mês. Faltam ${fmt(P.aporte - g)} por mês.`;
  return `<div class="dx-segcard"><div class="dx-sc-h"><h3>Aposentadoria ${quando}</h3></div>
    <p class="dx-chart-s" style="margin:6px 0 10px">Para receber ${fmt(A.renda)} por mês, você precisa juntar cerca de ${fmt(P.capital)}${P.jaTem > 0 ? ` (você já tem ${fmt(P.jaTem)})` : ""}.</p>

}
function telaRelatorio() {

  const faltam = L.filter(i => i.cor === "n");

  h += `<div class="dx-fim"><h3>Quer um diagnóstico completo?</h3><ol class="dx-fim-ol"><li>Conte pra gente o que achou dessa ferramenta como <b>comentário no nosso último post</b>!</li><li>Tire um <b>print do comentário</b> e mande por mensagem no nosso Instagram (@orienta.vc)</li><li>Vamos te encaminhar as próximas instruções</li></ol>
      <a class="dx-btn full dx-fim-btn" href="https://www.instagram.com/orienta.vc/" target="_blank" rel="noopener">Abrir o Instagram</a></div>
    <div class="dx-stack dx-acoes" style="margin-top:16px"><button class="dx-btn pri full" type="button" data-acao="compartilhar">Compartilhar resultado</button><button class="dx-btn sec full" type="button" data-acao="editar">Editar respostas</button><button class="dx-btn sec full" type="button" data-acao="recomecar">Começar do zero</button></div>
    <p class="dx-legal">Este diagnóstico é uma simulação educativa feita com os dados que você informou. Ele não é recomendação de investimento e não substitui um contador ou uma consultoria individual.</p>
    <p class="dx-legal">Conta de aposentadoria ilustrativa, em valores de hoje: rendimento de ${Math.round(CONFIG.aposentadoria.rendimentoReal * 100)}% ao ano acima da inflação e retirada de ${Math.round(CONFIG.aposentadoria.retirada * 100)}% ao ano do valor juntado.</p>`;

function resumoTexto() {
  const C = calcular(D), L = indicadores(D, C), P = pontuar(L), passos = escolherPassos(L);
  const l = [`Diagnóstico rápido orienta.vc${D.perfil.nome ? " de " + D.perfil.nome : ""}${D.perfil.email ? " (" + D.perfil.email.trim() + ")" : ""}`, `Nota: ${P.geral ?? "—"}/100${P.faixa ? " (" + P.faixa.nome + ")" : ""}`, "",

/* ====================== NAVEGAÇÃO ====================== */
const $ = s => document.querySelector(s);
function render(manter) {
  const y = window.scrollY, s = SCREENS[step];
  $("#tela").innerHTML = (s.titulo ? `<h1>${s.titulo}</h1>` : "") + s.html();
  document.body.classList.toggle("dx-laranja", s.id === "gastos");
  $("#etapa").textContent = s.seg;
  $("#barra").style.width = Math.round((step / REL) * 100) + "%";
  $("#nav").style.display = step === 0 || step === REL ? "none" : "";
  $("#seguir").textContent = step === REL - 1 ? "Ver meu diagnóstico" : "Continuar";
  atualizarLive();
  window.scrollTo(0, manter ? y : 0);
}
let enviado = false;
function enviarRespostas() {
  if (enviado || !FORMULARIO.url) return;
  enviado = true;
  const C = calcular(D), P = pontuar(indicadores(D, C));
  const IDADES = { "10": "Abaixo de 20", "20": "20 a 29", "30": "30 a 39", "40": "40 a 49", "50": "50 a 59", "60": "60 a 69", "70": "70 ou mais" };
  const TRAB = { autonomo: "Autônomo sem CNPJ", empresa: "MEI, ME ou PJ", outra_empresa: "Outro tipo de empresa", clt: "Carteira assinada", outros: "Outros" };
  const CONTAS = { uma: "Tudo numa só conta", duas: "2 contas e cartões", tres: "3 ou mais contas e cartões" };
  const FONTE = { inss: "INSS", investimentos: "Meus investimentos" };
  const num = v => (has(v) ? String(v) : "");
  const A = D.aposentadoria, G = D.gastos;
  const trab = (D.perfil.trabalho || []).map(k => k === "outros" && D.perfil.trabalhoOutro ? "Outros: " + D.perfil.trabalhoOutro : TRAB[k]).join(", ");
  const v = {
    email: (D.perfil.email || "").trim(), nome: (D.perfil.nome || "").trim(), idade: IDADES[D.perfil.idade] || "", trabalho: trab,
    renda: num(D.renda.media), irregular: D.renda.irregular === "sim" ? "Sim" : D.renda.irregular === "nao" ? "Não" : "", pior4: D.renda.irregular === "sim" ? num(D.renda.pior4) : "",
    essenciais: num(G.essenciais), livres: num(G.livres), outros: num(G.outros), guardar: num(G.guardar), contas: CONTAS[G.contas] || "",
    apoValor: num(A.renda), apoFonte: (A.fonte || []).map(k => FONTE[k]).join(", "), apoGuardado: (A.fonte || []).includes("investimentos") ? num(A.guardado) : "",
    apoOnde: (A.fonte || []).includes("investimentos") ? (A.tipos || []).map(k => APO_TIPOS[k]).join(", ") : "", nota: P.geral == null ? "" : String(P.geral)
  };
  const corpo = new URLSearchParams();
  Object.entries(FORMULARIO.campos).forEach(([k, id]) => corpo.append(id, v[k] || ""));
  try { fetch(FORMULARIO.url, { method: "POST", mode: "no-cors", body: corpo }).catch(() => {}); } catch (e) {}
}
let popupVisto = false;
function mostrarPopup() {
  if (popupVisto || document.querySelector(".dx-pop")) return;
  popupVisto = true;
  const el = document.createElement("div");
  el.className = "dx-pop";
  el.innerHTML = `<div class="dx-pop-fundo" data-fechar="1"></div>
    <div class="dx-pop-card" role="dialog" aria-modal="true" aria-labelledby="dx-pop-t">
      <button type="button" class="dx-pop-x" data-fechar="1" aria-label="Fechar">×</button>
      <h3 id="dx-pop-t">Quer um diagnóstico completo <b>gratuito</b>, <b>validado</b> por um profissional?</h3>
      <ol>
        <li>Conte pra gente o que achou dessa ferramenta como <b>comentário no nosso último post</b>!</li>
        <li>Tire um <b>print do comentário</b> e mande por mensagem no nosso Instagram (@orienta.vc)</li>
        <li>Vamos te encaminhar as próximas instruções</li>

window.addEventListener("scroll", () => {
  if (SCREENS[step] && SCREENS[step].id === "relatorio" && window.scrollY > 400) mostrarPopup();
}, { passive: true });
document.addEventListener("keydown", e => { if (e.key === "Escape") { const p = document.querySelector(".dx-pop"); if (p) p.remove(); } });
/* ====================== IMAGEM PARA COMPARTILHAR ====================== */
function quebrar(ctx, texto, larg) {
  const pal = texto.split(" "), linhas = []; let l = "";
  pal.forEach(p => { const t = l ? l + " " + p : p; if (ctx.measureText(t).width > larg && l) { linhas.push(l); l = p; } else l = t; });
  if (l) linhas.push(l); return linhas;
}
function caixa(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
async function gerarImagem() {
  try { await Promise.all(["400", "500", "700", "800"].map(w => document.fonts.load(`${w} 40px "Work Sans"`))); } catch (e) {}
  const C = calcular(D), L = indicadores(D, C), P = pontuar(L);
  const W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), F = '"Work Sans", system-ui, sans-serif';
  ctx.fillStyle = "#F7F9FC"; ctx.fillRect(0, 0, W, H);
  const cx = 72, cy = 96, cw = W - 144, ch = 840;
  const g = ctx.createLinearGradient(cx, cy, cx + cw, cy + ch);
  g.addColorStop(0, "#2ECC71"); g.addColorStop(0.65, "#27AE60"); g.addColorStop(1, "#13A36A");
  caixa(ctx, cx, cy, cw, ch, 48); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textBaseline = "alphabetic";
  const pad = cx + 64; let y = cy + 110;
  ctx.globalAlpha = 0.9; ctx.font = `500 38px ${F}`;
  ctx.fillText(new Date().toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" }), pad, y);
  ctx.globalAlpha = 1; y += 86; ctx.font = `800 64px ${F}`;
  const nome = (D.perfil.nome || "").trim();
  quebrar(ctx, nome ? "Diagnóstico de " + nome : "Seu diagnóstico financeiro", cw - 128).forEach(l => { ctx.fillText(l, pad, y); y += 74; });
  y += 170; ctx.font = `800 260px ${F}`;
  const nota = P.geral == null ? "—" : String(P.geral);
  ctx.fillText(nota, pad - 8, y); const nw = ctx.measureText(nota).width;
  ctx.globalAlpha = 0.85; ctx.font = `600 64px ${F}`; ctx.fillText("/100", pad + nw + 8, y); ctx.globalAlpha = 1;
  y += 60;
  if (P.faixa) {
    ctx.font = `800 44px ${F}`; const tw = ctx.measureText(P.faixa.nome).width;
    caixa(ctx, pad, y, tw + 64, 84, 42); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.fillStyle = "#27AE60"; ctx.fillText(P.faixa.nome, pad + 32, y + 57); y += 150;
    ctx.fillStyle = "#fff"; ctx.font = `400 42px ${F}`;
    quebrar(ctx, P.faixa.frase, cw - 128).forEach(l => { ctx.fillText(l, pad, y); y += 56; });
  } else {
    y += 40; ctx.font = `400 42px ${F}`;
    quebrar(ctx, "Preencha mais informações para calcular a nota.", cw - 128).forEach(l => { ctx.fillText(l, pad, y); y += 56; });
  }
  const logo = document.querySelector(".dx-logo");
  if (logo && logo.complete && logo.naturalWidth) {
    const lh = 120, lw = logo.naturalWidth * lh / logo.naturalHeight;
    ctx.drawImage(logo, (W - lw) / 2, cy + ch + (H - cy - ch - lh) / 2, lw, lh);
  }
  return new Promise(res => cv.toBlob(b => res(b), "image/png"));
}
function mostrarImagem(blob) {
  const url = URL.createObjectURL(blob);
  const el = document.createElement("div");
  el.className = "dx-pop";
  el.innerHTML = `<div class="dx-pop-fundo" data-fechar="1"></div><div class="dx-pop-card" role="dialog" aria-modal="true" aria-label="Imagem do resultado">
    <button type="button" class="dx-pop-x" data-fechar="1" aria-label="Fechar">×</button>
    <h3>Seu resultado</h3><img src="${url}" alt="Imagem do seu diagnóstico" style="width:100%;border-radius:12px;display:block;margin-bottom:12px">
    <p class="dx-chart-s" style="margin:0">No celular, toque e segure a imagem para salvar ou compartilhar.</p></div>`;
  document.body.appendChild(el);
  el.addEventListener("click", e => { if (e.target.closest("[data-fechar]")) { el.remove(); URL.revokeObjectURL(url); } });
}
function baixarImagem(blob) {
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "meu-diagnostico-orienta.png";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function compartilhar(btn) {
  const txt = btn.textContent; btn.disabled = true; btn.textContent = "Preparando imagem…";
  try {
    const blob = await gerarImagem();
    const file = new File([blob], "meu-diagnostico-orienta.png", { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Meu diagnóstico financeiro" }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    if (window.matchMedia("(pointer: coarse)").matches) mostrarImagem(blob);
    else baixarImagem(blob);
  } finally { btn.disabled = false; btn.textContent = txt; }
}
/* Meta Pixel: o fbq fica no index.html (janela pai); esta página roda dentro de um iframe do mesmo domínio. */
function pixel(...args) { try { const f = window.fbq || (window.parent && window.parent.fbq); if (f) f(...args); } catch (e) {} }
let pixelMetade = false, pixelLead = false;
function ir(n) {
  step = Math.max(0, Math.min(REL, n)); salvar(); render(false);
  if (step === 3 && !pixelMetade) { pixelMetade = true; pixel("trackCustom", "MetadeDiagnostico", { publico: "pj" }); }
  if (step === REL && !pixelLead) { pixelLead = true; pixel("track", "Lead", { content_category: "pj" }); }
}
function atualizarLive() { const C = calcular(D); document.querySelectorAll("[data-live=total]").forEach(el => (el.textContent = fmt(C.gastos + n0(C.guardar)))); }
function toast(msg) { const t = document.createElement("div"); t.className = "dx-toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

document.addEventListener("input", e => {
  const t = e.target, p = t.dataset && t.dataset.path; if (!p) return;
  if (t.dataset.type === "money") { const dig = t.value.replace(/\D/g, "").slice(0, 10); const v = dig === "" ? null : parseInt(dig, 10); t.value = v == null ? "" : v.toLocaleString("pt-BR"); setPath(p, v); }
  else setPath(p, t.value);
  if (p === "perfil.email" && emailOk(t.value)) { const er = $("#erro-email"); if (er) er.hidden = true; }
  atualizarLive();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.matches || !e.target.matches("#tela input")) return;
  e.preventDefault();
  const campos = [...document.querySelectorAll("#tela input")], prox = campos[campos.indexOf(e.target) + 1];
  if (prox) prox.focus(); else e.target.blur();
});
document.addEventListener("focusin", e => { if (e.target.matches && e.target.matches("input")) setTimeout(() => { try { e.target.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (err) {} }, 300); });
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.chip) {
    const p = b.dataset.chip, v = b.dataset.val;
    if (b.dataset.multi) { const arr = (get(p) || []).slice(), i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); setPath(p, arr); }
    else setPath(p, String(get(p)) === String(v) ? null : v);
    render(true); return;
  }
  const a = b.dataset.acao;
  if (a === "comecar" || a === "recomecar") { limpar(); D = novo(); popupVisto = false; enviado = false; pixelMetade = false; pixelLead = false; ir(1); }
  else if (a === "editar") ir(1);
  else if (a === "compartilhar") compartilhar(b);
  else if (a === "copiar") { try { navigator.clipboard.writeText(resumoTexto()).then(() => toast("Resumo copiado"), () => toast("Não deu para copiar neste aparelho")); } catch (err) { toast("Não deu para copiar neste aparelho"); } }
});
$("#voltar").addEventListener("click", () => ir(step - 1));
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((e || "").trim());
$("#seguir").addEventListener("click", () => {
  if (SCREENS[step].id === "gastos" && !emailOk(D.perfil.email)) {
    const er = $("#erro-email"), inp = $("#f-perfil-email");
    if (er) er.hidden = false;
    if (inp) { inp.focus(); inp.scrollIntoView({ block: "center", behavior: "smooth" }); }
    return;
  }
  if (SCREENS[step].id === "gastos") enviarRespostas();
  ir(step + 1);
});
render(false);
</script>
