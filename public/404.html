<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Orienta</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a2e35;
        font-family: 'Work Sans', 'Segoe UI', Arial, sans-serif;
        color: #fff;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .wrap { max-width: 28rem; }
      img { height: 3.5rem; margin-bottom: 2rem; }
      h1 {
        font-size: clamp(3rem, 10vw, 5rem);
        font-weight: 900;
        margin: 0 0 0.5rem;
        color: #1daf66;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 1.05rem;
        color: rgba(255, 255, 255, 0.6);
        margin: 0 0 2rem;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #1daf66;
        color: #1a2e35;
        font-weight: 700;
        text-decoration: none;
        padding: 0.85rem 1.75rem;
        border-radius: 999px;
        transition: opacity 0.15s;
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/logo.png" alt="Orienta" />
      <h1>404</h1>
      <p>A página que você procura não existe ou foi movida.</p>
      <a href="/">Voltar para a página inicial</a>
    </div>
  </body>
</html>
